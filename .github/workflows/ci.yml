name: CI / CD

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend – testy
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Instalace závislostí
        run: pip install -r requirements.txt
      - name: Testy (včetně kontroly migrací)
        run: python -m pytest -q

  frontend:
    name: Frontend – typy, build, testy
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Instalace závislostí
        run: npm ci
      - name: Build (kontrola typů + vite build)
        run: npm run build
      - name: Unit testy
        run: npm test

  images:
    name: Docker – sestavení image a smoke test
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Konfigurace pro smoke test (náhodná tajemství)
        run: |
          cp .env.example .env
          sed -i "s|^POSTGRES_PASSWORD=.*|POSTGRES_PASSWORD=$(openssl rand -hex 16)|" .env
          sed -i "s|^SECRET_KEY=.*|SECRET_KEY=$(openssl rand -hex 32)|" .env
      - name: Validace compose souboru
        run: docker compose config --quiet
      - name: Sestavení a spuštění stacku
        run: docker compose up -d --build --wait
      - name: Smoke test přes nginx
        run: |
          curl -fsS http://localhost:8080/ > /dev/null
          curl -fsS http://localhost:8080/api/health | grep -q '"ok"'
          curl -fsS http://localhost:8080/api/auth/sso/config | grep -q '"enabled"'
      - name: Logy při selhání
        if: failure()
        run: docker compose logs --no-color
      - name: Úklid
        if: always()
        run: docker compose down -v

  deploy:
    name: Nasazení na server
    needs: [images]
    # Spustí se jen na main, a jen pokud je v repozitáři nastavena proměnná DEPLOY_ENABLED=true.
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: production   # nastavte v GitHubu required reviewers, aby nasazení schvaloval člověk
    steps:
      - name: Připojení přes SSH a aktualizace
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e
            cd "${{ secrets.DEPLOY_PATH }}"
            git pull --ff-only origin main
            docker compose up -d --build --wait
            docker compose ps
