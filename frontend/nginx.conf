# WebSocket: Upgrade jen když ho klient posílá
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    client_max_body_size 6m;   # příloha omluvenky má limit 5 MB

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/manifest+json;

    # API a WebSocket: /api/x → backend /x (hlavičky platí z bloku serveru, nic dalšího nepřidává)
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        include /etc/nginx/security-headers.conf;
    }

    # service worker se nesmí cachovat, jinak by se aktualizace nedostala ke klientům
    location = /sw.js {
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/security-headers.conf;
        try_files /sw.js =404;
    }

    location = /manifest.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/security-headers.conf;
        try_files /manifest.webmanifest =404;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        include /etc/nginx/security-headers.conf;
        try_files $uri =404;
    }

    # SPA: neznámé cesty vrací index.html (React Router)
    location / {
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/security-headers.conf;
        try_files $uri $uri/ /index.html;
    }
}
